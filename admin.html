
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nexus • Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#05050b;--card:rgba(255,255,255,.045);--border:rgba(255,255,255,.09);
    --text:#eef0f7;--muted:#8a8aa8;--accent:#7c5cff;--accent2:#00e0ff;
    --grad:linear-gradient(135deg,#7c5cff,#00e0ff);
  }
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  .orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;z-index:0}
  .orb.a{width:520px;height:520px;background:#7c5cff;top:-180px;left:-180px;animation:fl1 18s ease-in-out infinite}
  .orb.b{width:480px;height:480px;background:#00e0ff;bottom:-200px;right:-160px;animation:fl2 22s ease-in-out infinite}
  @keyframes fl1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
  @keyframes fl2{0%,100%{transform:translate(0,0)}50%{transform:translate(-100px,-70px)}}

  /* LOGIN */
  .center{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .glass{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px 34px;
    backdrop-filter:blur(24px);box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:440px;width:100%;
    animation:pop .5s cubic-bezier(.2,.9,.3,1.3);position:relative;overflow:hidden}
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
  h1{font-size:26px;font-weight:800;margin-bottom:8px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
  .btn{width:100%;padding:15px;border-radius:14px;border:none;font-family:inherit;font-size:15px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;background:var(--grad);
    box-shadow:0 10px 30px rgba(124,92,255,.35);transition:all .25s;position:relative;overflow:hidden}
  .btn:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(124,92,255,.5)}
  .btn.google{background:#fff;color:#111}
  .err{color:#ff6b8a;font-size:13px;margin-top:12px;text-align:center}

  /* LAYOUT */
  .app{display:none;position:relative;z-index:2;min-height:100vh;padding:20px}
  .app.show{display:block}
  .grid{display:grid;grid-template-columns:320px 1fr;gap:20px;max-width:1400px;margin:0 auto;height:calc(100vh - 40px)}
  @media(max-width:960px){.grid{grid-template-columns:1fr;height:auto}}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:22px;backdrop-filter:blur(20px);overflow:hidden;display:flex;flex-direction:column}
  .panel-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .panel-head h2{font-size:16px;font-weight:700}
  .panel-body{flex:1;overflow-y:auto;padding:14px}
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}

  .brandbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;max-width:1400px;margin-left:auto;margin-right:auto}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-weight:800;box-shadow:0 8px 24px rgba(124,92,255,.4)}
  .brand .ttl{font-weight:700;font-size:15px}
  .brand .sb{font-size:11px;color:var(--muted)}

  .chip{padding:8px 14px;border-radius:10px;background:var(--grad);border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(124,92,255,.35);transition:transform .2s;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{transform:translateY(-1px)}
  .chip.ghost{background:rgba(255,255,255,.05);border:1px solid var(--border);box-shadow:none}

  .list-item{padding:12px 14px;border-radius:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .list-item:hover{background:rgba(255,255,255,.05)}
  .list-item.active{background:linear-gradient(135deg,rgba(124,92,255,.2),rgba(0,224,255,.1));border:1px solid rgba(124,92,255,.4)}
  .list-item .av{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
  .list-item .nm{font-weight:600;font-size:14px}
  .list-item .ml{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}

  /* Chat */
  .chat-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .chat-head .who{display:flex;align-items:center;gap:12px}
  .chat-head .av{width:42px;height:42px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;position:relative}
  .chat-head .av.online::after{content:"";position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;background:#22e07a;border:2px solid #05050b;box-shadow:0 0 8px #22e07a}
  .chat-head .nm{font-weight:600;font-size:15px}
  .chat-head .ml{font-size:11px;color:var(--muted)}

  .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
  .messages::-webkit-scrollbar{width:6px}
  .messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
  .msg{max-width:70%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word;animation:sl .35s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes sl{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .msg.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:5px;box-shadow:0 6px 18px rgba(124,92,255,.3)}
  .msg.them{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid var(--border);border-bottom-left-radius:5px}
  .msg .time{font-size:10px;opacity:.7;margin-top:4px;display:block}

  .composer{padding:14px;border-top:1px solid var(--border);display:flex;gap:10px;background:rgba(0,0,0,.2)}
  .composer input{flex:1;padding:13px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:14px;outline:none}
  .composer input:focus{border-color:rgba(124,92,255,.6)}
  .send{width:46px;height:46px;border-radius:12px;background:var(--grad);border:none;display:grid;place-items:center;cursor:pointer;color:#fff;transition:transform .2s;box-shadow:0 8px 20px rgba(124,92,255,.4)}
  .send:hover{transform:scale(1.06) rotate(-8deg)}

  /* Codes */
  .code-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);margin-bottom:8px;font-family:monospace;font-size:14px;letter-spacing:2px;font-weight:600}
  .code-row .status{font-size:10px;padding:3px 8px;border-radius:6px;font-family:'Inter';letter-spacing:.5px;font-weight:600}
  .code-row .status.free{background:rgba(34,224,122,.15);color:#22e07a}
  .code-row .status.used{background:rgba(255,107,138,.15);color:#ff6b8a}
  .copy{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:4px 8px;border-radius:6px}
  .copy:hover{background:rgba(255,255,255,.08);color:#fff}

  /* Call modal (incoming) */
  .modal{position:fixed;inset:0;background:rgba(5,5,11,.85);backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.show{display:flex;animation:fd .3s}
  @keyframes fd{from{opacity:0}to{opacity:1}}
  .call-card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:44px 36px;text-align:center;max-width:380px;width:100%;backdrop-filter:blur(24px);position:relative;overflow:hidden;animation:pop .5s}
  .rings{position:relative;width:130px;height:130px;margin:0 auto 24px}
  .rings .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(124,92,255,.6);animation:rng 2s infinite}
  .rings .ring:nth-child(2){animation-delay:.6s}
  .rings .ring:nth-child(3){animation-delay:1.2s}
  @keyframes rng{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.6);opacity:0}}
  .rings .core{position:absolute;inset:22px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:34px;box-shadow:0 12px 40px rgba(124,92,255,.6)}
  .call-title{font-size:20px;font-weight:700;margin-bottom:6px}
  .call-sub{color:var(--muted);font-size:14px;margin-bottom:28px}
  .call-acts{display:flex;gap:14px;justify-content:center}
  .call-act{width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;color:#fff;transition:transform .2s}
  .call-act:hover{transform:scale(1.08)}
  .call-act.end{background:#ff3b6b;box-shadow:0 10px 30px rgba(255,59,107,.5)}
  .call-act.accept{background:#22e07a;box-shadow:0 10px 30px rgba(34,224,122,.5)}
  .call-act svg{width:26px;height:26px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:rgba(255,255,255,.08);border:1px solid var(--border);backdrop-filter:blur(20px);padding:14px 22px;border-radius:14px;font-size:14px;z-index:100;transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .tabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--border)}
  .tab{flex:1;padding:9px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .tab.active{background:rgba(124,92,255,.18);color:#fff}
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <!-- LOGIN -->
  <div class="center" id="loginWrap">
    <div class="glass">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <div style="width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:18px">A</div>
        <div>
          <div style="font-weight:700">Admin Console</div>
          <div style="font-size:12px;color:var(--muted)">Nexus Portal</div>
        </div>
      </div>
      <h1>Admin Sign In</h1>
      <p class="sub">Authorized personnel only.</p>
      <button class="btn google" id="adminLogin">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.2 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <!-- APP -->
  <div class="app" id="appWrap">
    <div class="brandbar">
      <div class="brand">
        <div class="logo">A</div>
        <div><div class="ttl">Admin Console</div><div class="sb" id="adminEmail">—</div></div>
      </div>
      <button class="chip ghost" id="logout">Logout</button>
    </div>

    <div class="grid">
      <!-- LEFT PANEL -->
      <div class="panel">
        <div class="tabs">
          <button class="tab active" data-tab="clients">Clients</button>
          <button class="tab" data-tab="codes">Codes</button>
        </div>

        <div class="panel-body" id="clientsPane">
          <div id="clientsList"></div>
        </div>

        <div class="panel-body" id="codesPane" style="display:none">
          <button class="chip" id="genCode" style="width:100%;justify-content:center;margin-bottom:14px">
            + Generate Employee Code
          </button>
          <div id="codesList"></div>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="panel">
        <div class="chat-head" id="chatHead">
          <div class="who">
            <div class="av">💬</div>
            <div>
              <div class="nm">Select a client</div>
              <div class="ml">Choose from the list to start chatting</div>
            </div>
          </div>
        </div>
        <div class="messages" id="messages">
          <div class="empty">No conversation selected yet.</div>
        </div>
        <div class="composer">
          <input id="msgInput" placeholder="Type a reply..." disabled/>
          <button class="send" id="sendBtn" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Incoming call -->
  <div class="modal" id="callModal">
    <div class="call-card">
      <div class="rings">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="core">📞</div>
      </div>
      <div class="call-title" id="callTitle">Incoming Call</div>
      <div class="call-sub" id="callSub">—</div>
      <div class="call-acts" id="callActs">
        <button class="call-act end" id="declineBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
        </button>
        <button class="call-act accept" id="acceptBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay></audio>
  <div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, addDoc,
  onSnapshot, query, orderBy, where, serverTimestamp, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ============================
   🔥 FIREBASE CONFIG
   ============================ */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDcZbBLCr5kJxAyrlIKxqCkHuIGMVGbn0Q",
  authDomain: "phone-916c3.firebaseapp.com",
  projectId: "phone-916c3",
  storageBucket: "phone-916c3.firebasestorage.app",
  messagingSenderId: "147458670282",
  appId: "1:147458670282:web:1b5e2db7328bec35ad3e33",
  measurementId: "G-RN2LJGZC71"
};

/* ⚠️ ADMIN EMAIL — यही email Firebase Rules में भी डालें */
const ADMIN_EMAIL = "anandmm7777@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const ICE = { iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" }
]};

const $ = (id) => document.getElementById(id);
const toast = (m) => { const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2400); };
const esc = (s) => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let adminUser = null;
let clients = [];
let activeClientId = null;
let unsubMessages = null;
let codesUnsub = null, clientsUnsub = null, callsUnsub = null;
let pc=null, localStream=null, currentCallDoc=null, unsubCallDoc=null, unsubCalleeCand=null;

/* ============= LOGIN ============= */
$("adminLogin").onclick = async () => {
  $("loginErr").textContent = "";
  try {
    const res = await signInWithPopup(auth, provider);
    if (res.user.email !== ADMIN_EMAIL) {
      await signOut(auth);
      $("loginErr").textContent = "❌ Unauthorized email. Admin only.";
    }
  } catch(e){ $("loginErr").textContent = e.message; }
};

$("logout").onclick = async () => { await signOut(auth); location.reload(); };

onAuthStateChanged(auth, (user) => {
  if (!user) { $("loginWrap").style.display = "flex"; $("appWrap").classList.remove("show"); return; }
  if (user.email !== ADMIN_EMAIL) { signOut(auth); return; }
  adminUser = user;
  $("loginWrap").style.display = "none";
  $("appWrap").classList.add("show");
  $("adminEmail").textContent = user.email;
  initAdmin();
});

/* ============= INIT ============= */
function initAdmin() {
  loadClients();
  loadCodes();
  listenForCalls();
}

/* ============= TABS ============= */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  const tab = t.dataset.tab;
  $("clientsPane").style.display = tab === "clients" ? "block" : "none";
  $("codesPane").style.display = tab === "codes" ? "block" : "none";
});

/* ============= CLIENTS ============= */
function loadClients() {
  if (clientsUnsub) clientsUnsub();
  const q = query(collection(db, "users"), orderBy("createdAt", "desc"));
  clientsUnsub = onSnapshot(q, (snap) => {
    clients = [];
    snap.forEach(d => clients.push({ id: d.id, ...d.data() }));
    renderClients();
  });
}

function renderClients() {
  const box = $("clientsList");
  if (!clients.length) { box.innerHTML = `<div class="empty">No clients yet.</div>`; return; }
  box.innerHTML = clients.map(c => `
    <div class="list-item ${activeClientId===c.id?"active":""}" data-id="${c.id}">
      <div class="av">${esc((c.name||"U")[0]).toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(c.name||"Unnamed")}</div>
        <div class="ml">${esc(c.email||"")}</div>
      </div>
    </div>`).join("");
  box.querySelectorAll(".list-item").forEach(el => {
    el.onclick = () => selectClient(el.dataset.id);
  });
}

function selectClient(uid) {
  activeClientId = uid;
  const c = clients.find(x => x.id === uid);
  renderClients();

  $("chatHead").innerHTML = `
    <div class="who">
      <div class="av online">${esc((c.name||"U")[0]).toUpperCase()}</div>
      <div>
        <div class="nm">${esc(c.name||"Unnamed")}</div>
        <div class="ml">${esc(c.email||"")} • ${esc(c.phone||"")}</div>
      </div>
    </div>`;

  $("msgInput").disabled = false;
  $("sendBtn").disabled = false;

  // subscribe
  if (unsubMessages) unsubMessages();
  const q = query(collection(db, "chats", uid, "messages"), orderBy("createdAt", "asc"));
  unsubMessages = onSnapshot(q, (snap) => {
    const box = $("messages");
    box.innerHTML = "";
    if (snap.empty) { box.innerHTML = `<div class="empty">No messages yet. Say hi 👋</div>`; return; }
    snap.forEach(d => {
      const m = d.data();
      const mine = m.senderRole === "admin";
      const el = document.createElement("div");
      el.className = "msg " + (mine ? "me" : "them");
      const time = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : "";
      el.innerHTML = `${esc(m.text)}<span class="time">${time}</span>`;
      box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  });
}

/* ============= SEND MESSAGE ============= */
$("sendBtn").onclick = sendReply;
$("msgInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendReply(); });

async function sendReply() {
  if (!activeClientId) return;
  const inp = $("msgInput");
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  try {
    await addDoc(collection(db, "chats", activeClientId, "messages"), {
      text,
      senderId: adminUser.uid,
      senderName: "Admin",
      senderRole: "admin",
      createdAt: serverTimestamp()
    });
  } catch(e) { toast("⚠️ Failed to send"); console.error(e); }
}

/* ============= EMPLOYEE CODES ============= */
$("genCode").onclick = async () => {
  const code = "EMP-" + Math.random().toString(36).slice(2, 8).toUpperCase();
  try {
    await setDoc(doc(db, "employeeCodes", code), {
      code, used: false, createdAt: serverTimestamp(), createdBy: adminUser.uid
    });
    toast("✅ Code generated: " + code);
  } catch(e) { toast("⚠️ Error: " + e.message); }
};

function loadCodes() {
  if (codesUnsub) codesUnsub();
  const q = query(collection(db, "employeeCodes"), orderBy("createdAt", "desc"));
  codesUnsub = onSnapshot(q, (snap) => {
    const box = $("codesList");
    if (snap.empty) { box.innerHTML = `<div class="empty">No codes yet. Generate one ☝️</div>`; return; }
    box.innerHTML = "";
    snap.forEach(d => {
      const c = d.data();
      const row = document.createElement("div");
      row.className = "code-row";
      row.innerHTML = `
        <span>${esc(c.code)}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="status ${c.used?"used":"free"}">${c.used?"USED":"FREE"}</span>
          <button class="copy" data-code="${esc(c.code)}">Copy</button>
        </div>`;
      box.appendChild(row);
    });
    box.querySelectorAll(".copy").forEach(b => b.onclick = () => {
      navigator.clipboard.writeText(b.dataset.code);
      toast("📋 Copied: " + b.dataset.code);
    });
  });
}

/* ============= WEBRTC — INCOMING CALLS ============= */
function listenForCalls() {
  const q = query(collection(db, "calls"), where("status", "==", "ringing"));
  callsUnsub = onSnapshot(q, (snap) => {
    snap.docChanges().forEach(ch => {
      if (ch.type === "added") {
        const data = ch.doc.data();
        if (data.from) showIncomingCall(ch.doc.id, data);
      }
    });
  });
}

function showIncomingCall(callId, data) {
  if (pc) return; // already in call
  $("callModal").classList.add("show");
  $("callTitle").textContent = "Incoming Call";
  $("callSub").textContent = data.fromName || "Unknown client";

  $("acceptBtn").onclick = () => acceptCall(callId);
  $("declineBtn").onclick = async () => {
    await updateDoc(doc(db, "calls", callId), { status: "ended", endedAt: serverTimestamp() });
    $("callModal").classList.remove("show");
  };
}

async function acceptCall(callId) {
  try {
    currentCallDoc = doc(db, "calls", callId);
    const snap = await getDoc(currentCallDoc);
    const data = snap.data();

    pc = new RTCPeerConnection(ICE);
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    pc.ontrack = (e) => { $("remoteAudio").srcObject = e.streams[0]; };

    pc.onicecandidate = async (e) => {
      if (e.candidate) {
        await addDoc(collection(db, "calls", callId, "calleeCandidates"), e.candidate.toJSON());
      }
    };

    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await updateDoc(currentCallDoc, {
      answer: { type: answer.type, sdp: answer.sdp },
      status: "active",
      answeredAt: serverTimestamp()
    });

    // listen caller candidates
    unsubCalleeCand = onSnapshot(collection(db, "calls", callId, "callerCandidates"), (s) => {
      s.docChanges().forEach(async (ch) => {
        if (ch.type === "added" && pc) {
          try { await pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())); } catch(e){}
        }
      });
    });

    // watch for end
    unsubCallDoc = onSnapshot(currentCallDoc, (s) => {
      if (s.data()?.status === "ended") endCall();
    });

    // swap UI buttons to End Call
    $("callTitle").textContent = "Connected";
    $("callSub").textContent = data.fromName || "Client";
    $("callActs").innerHTML = `
      <button class="call-act end" id="endLive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
      </button>`;
    $("endLive").onclick = endCall;

  } catch (e) {
    console.error(e);
    toast("⚠️ Could not accept call");
    endCall();
  }
}

async function endCall() {
  try { if (localStream) localStream.getTracks().forEach(t => t.stop()); } catch(e){}
  try { if (pc) pc.close(); } catch(e){}
  if (unsubCallDoc) { unsubCallDoc(); unsubCallDoc = null; }
  if (unsubCalleeCand) { unsubCalleeCand(); unsubCalleeCand = null; }
  if (currentCallDoc) {
    try { await updateDoc(currentCallDoc, { status: "ended", endedAt: serverTimestamp() }); } catch(e){}
    currentCallDoc = null;
  }
  pc = null; localStream = null;
  $("callModal").classList.remove("show");
  // restore buttons
  $("callActs").innerHTML = `
    <button class="call-act end" id="declineBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
    </button>
    <button class="call-act accept" id="acceptBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </button>`;
  $("callTitle").textContent = "Incoming Call";
  $("callSub").textContent = "—";
}
</script>
